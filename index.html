<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tetris Atelier</title><style id="styles">
:root {
  color-scheme:dark;
  --bg:#101411;
  --panel:#191f1a;
  --line:#333b31;
  --ink:#eeeedd;
  --muted:#99a491;
  --accent:#dfba69;
  --board-w:clamp(120px,32vw,300px);
  font-family:Arial,Helvetica,sans-serif
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:radial-gradient(ellipse at 50% 0,#283025 0,transparent 55%),var(--bg);
  color:var(--ink);
  min-height:100vh
}
button,select,input {
  font:inherit
}
button,select {
  border:1px solid var(--line);
  border-radius:6px;
  color:var(--ink);
  background:#242c23;
  padding:10px;
  cursor:pointer
}
button:hover {
  border-color:var(--accent);
  background:#30392a
}
button:focus-visible,select:focus-visible {
  outline:2px solid var(--accent);
  outline-offset:3px
}
button.primary {
  background:var(--accent);
  border-color:var(--accent);
  color:#201d12;
  font-weight:bold
}
header {
  max-width:1100px;
  margin:auto;
  padding:34px 24px 26px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px
}
.brand {
  display:flex;
  gap:14px;
  align-items:center
}
.mark {
  display:grid;
  grid-template-columns:repeat(3,10px);
  gap:3px
}
.mark i {
  height:10px;
  background:var(--accent);
  border-radius:1px
}
.mark i:first-child {
  grid-column:2
}
.eyebrow,.label,.version {
  font:10px/1.5 monospace;
  text-transform:uppercase;
  letter-spacing:2px;
  color:var(--muted)
}
h1 {
  font-size:25px;
  letter-spacing:5px;
  margin:0;
  font-weight:500
}
.version {
  border:1px solid var(--line);
  padding:9px 13px;
  border-radius:30px;
  white-space:nowrap
}
.arena {
  display:grid;
  grid-template-columns:minmax(0,1fr) var(--board-w) minmax(0,1fr);
  gap:14px;
  align-items:start;
  padding:0 0 30px
}
.rail {
  display:flex;
  gap:14px;
  align-items:flex-start;
  overflow-x:auto;
  scrollbar-width:thin;
  padding-bottom:8px
}
.left {
  justify-content:flex-end
}
.right {
  justify-content:flex-start
}
.panel {
  flex:none;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:18px;
  box-shadow:0 8px 25px #0002
}
.panel h2 {
  font-size:12px;
  line-height:1.5;
  letter-spacing:1px;
  margin:0 0 22px;
  text-transform:uppercase;
  font-weight:500;
  color:var(--accent)
}
.info {
  width:clamp(96px,14vw,172px);
  min-height:calc(var(--board-w)*2);
  display:flex;
  flex-direction:column;
  position:sticky;
  right:0;
  z-index:2
}
.stats {
  display:grid;
  gap:24px
}
.stat strong {
  display:block;
  font:30px/1.3 monospace;
  color:var(--ink);
  letter-spacing:-1px
}
.stat.small strong {
  font-size:22px
}
.state {
  font:11px monospace;
  color:var(--accent);
  text-transform:uppercase;
  letter-spacing:1px;
  margin:20px 0
}
.game-buttons {
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:6px;
  margin-top:auto
}
.game-buttons button {
  min-width:0;
  overflow-wrap:anywhere;
  padding:11px 5px;
  font-size:11px;
  line-height:1.4
}
.board-wrap {
  position:relative;
  border:1px solid #62684d;
  border-radius:7px;
  overflow:hidden;
  box-shadow:0 15px 60px #0008;
  background:#101811
}
.board-wrap canvas {
  display:block;
  width:100%;
  height:auto;
  aspect-ratio:1/2;
  outline:none
}
.board-wrap:focus-within {
  border-color:var(--accent)
}
.veil {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  flex-direction:column;
  background:#101811c9;
  pointer-events:none;
  gap:12px
}
.veil strong {
  font-size:clamp(14px,2vw,23px);
  font-weight:500;
  letter-spacing:3px
}
.veil span {
  font-size:11px;
  color:var(--muted);
  line-height:1.6;
  padding:0 10px
}
.help {
  width:190px
}
.help p {
  font-size:12px;
  line-height:1.8;
  color:var(--muted);
  margin:20px 0 0
}
.keys {
  display:grid;
  gap:13px
}
.key-row {
  display:flex;
  justify-content:space-between;
  gap:10px;
  font-size:11px;
  align-items:center;
  color:var(--muted)
}
kbd {
  display:inline-block;
  font:11px monospace;
  border:1px solid #505943;
  background:#283024;
  padding:4px 6px;
  border-radius:4px;
  color:var(--ink)
}
.board-note {
  text-align:center;
  font:10px/1.7 monospace;
  letter-spacing:1px;
  color:var(--muted);
  margin:14px 0
}
.message {
  min-height:24px;
  text-align:center;
  color:var(--accent);
  font-size:12px;
  margin:0 20px 20px
}
[hidden] {
  display:none!important
}
.toggles {
  display:flex;
  flex-direction:column;
  gap:5px;
  margin:20px 0 10px
}
.toggles button {
  padding:6px;
  font-size:10px
}
.preview {
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:15px 0
}
.preview figure {
  margin:0;
  min-width:0
}
.preview figcaption {
  font:9px monospace;
  letter-spacing:1px;
  color:var(--muted);
  margin-bottom:6px
}
.preview canvas {
  width:52px;
  height:44px
}
.settings {
  width:220px
}
.settings label {
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-bottom:15px;
  line-height:1.7
}
.settings select {
  display:block;
  width:100%;
  font-size:11px;
  margin-top:4px;
  padding:8px
}
.file-buttons {
  display:flex;
  gap:8px;
  margin-top:18px
}
.file-buttons button {
  flex:1;
  font-size:12px
}
.leaderboard {
  width:185px
}
.leaderboard ol {
  margin:0;
  padding:0;
  list-style:none
}
.leaderboard li {
  padding:12px 0;
  border-bottom:1px solid var(--line);
  font:14px monospace
}
.leaderboard small {
  display:block;
  color:var(--muted);
  font:9px/1.7 monospace;
  margin-top:4px
}
.empty {
  font-size:12px;
  line-height:1.8;
  color:var(--muted)
}
.bonuses {
  letter-spacing:4px;
  color:var(--accent);
  font-size:22px;
  min-height:26px
}
.bonus-label {
  font:9px/1.6 monospace;
  color:var(--muted)
}
@media(max-width:700px) {
  header {
  padding:22px 12px
}
.arena {
  gap:6px
}
.rail {
  gap:6px
}
.panel {
  padding:10px
}
.info h2 {
  font-size:9px;
  letter-spacing:0;
  margin-bottom:14px
}
.stats {
  gap:14px
}
.stat strong {
  font-size:22px
}
.stat.small strong {
  font-size:17px
}
.game-buttons {
  gap:3px
}
.game-buttons button {
  font-size:9px;
  padding:8px 2px
}
.state {
  font-size:9px;
  letter-spacing:0
}
.eyebrow {
  font-size:8px
}
h1 {
  font-size:18px
}
.version {
  font-size:8px;
  padding:6px
}
.preview {
  gap:2px
}
.preview canvas {
  width:35px;
  height:30px
}

}


</style></head><body><main id="root"></main>
<script id="app">
'use strict';
/* 1. Piece geometry and board rules */
const API = {};
function emptyBoard(){return Array.from({length:20},()=>Array(10).fill(0));}
const SHAPES={I:[[0,1],[1,1],[2,1],[3,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]],O:[[0,0],[1,0],[0,1],[1,1]],S:[[1,0],[2,0],[0,1],[1,1]],T:[[1,0],[0,1],[1,1],[2,1]],Z:[[0,0],[1,0],[1,1],[2,1]]};
const COLORS={I:'#58c6d2',J:'#738dea',L:'#edac6d',O:'#e7cd6b',S:'#8fcb92',T:'#bd95e2',Z:'#e78390',P:'#ffffff'};
const matrixSize=t=>t==='I'?4:t==='O'?2:3;
function cells(type,rot=0,x=0,y=0){
  const n=matrixSize(type);return SHAPES[type].map(point=>{let [a,b]=point;
    if(type!=='O')for(let i=0;i<((rot%4)+4)%4;i++)[a,b]=[n-1-b,a];
    return [a+x,b+y];});
}
function valid(board,type,rot,x,y){return cells(type,rot,x,y).every(([a,b])=>a>=0&&a<10&&b>=0&&b<20&&!board[b][a]);}
function transform(board,piece,dx=0,dy=0,dr=0){const p={...piece,x:piece.x+dx,y:piece.y+dy,rot:(piece.rot+dr+4)%4};return valid(board,p.type,p.rot,p.x,p.y)?p:piece;}
Object.assign(API,{emptyBoard,cells,valid,transform});
/* 2. Game state and active-play timing */
const TYPES=Object.keys(SHAPES);
const addScore=(a,b)=>Math.min(Number.MAX_SAFE_INTEGER,a+b);
function clearRows(board){const keep=board.filter(row=>row.some(v=>!v));const count=20-keep.length;return {count,board:[...Array.from({length:count},()=>Array(10).fill(0)),...keep.map(r=>r.slice())]};}
class Game {
  constructor(rng=Math.random){this.rng=rng;this.board=emptyBoard();this.status='idle';this.score=0;this.lines=0;this.level=1;this.p=null;this.generation=0;this.events=[];this.elapsed=0;}
  pause(){if(this.status==='running')this.status='paused';else if(this.status==='paused')this.status='running';}
  interval(){return Math.max(80,Math.floor(1000*Math.pow(0.8,this.level-1)));}
  draw(){return TYPES[Math.floor(this.rng()*7)%7];}
  start(){this.board=emptyBoard();this.score=0;this.lines=0;this.level=1;this.events=[];this.elapsed=0;this.status='running';this.spawn();}
  spawn(type=this.next()){this.generation++;this.elapsed=0;this.p={type,rot:0,x:Math.floor((10-matrixSize(type))/2),y:0};if(!valid(this.board,type,0,this.p.x,0))this.finish();}
  finish(){if(this.status==='over')return;this.status='over';this.events.push({kind:'game-over',score:this.score,generation:this.generation});}
  act(dx=0,dy=0,dr=0){if(this.status!=='running')return false;const next=transform(this.board,this.p,dx,dy,dr);if(next===this.p){if(dy>0)this.lock();return false;}this.p=next;return true;}
  soft(){if(this.act(0,1,0))this.score=addScore(this.score,1);}
  lock(){if(this.status!=='running'||!valid(this.board,this.p.type,this.p.rot,this.p.x,this.p.y))return false;for(const [x,y] of cells(this.p.type,this.p.rot,this.p.x,this.p.y))this.board[y][x]=this.p.type;
    const cleared=clearRows(this.board);this.board=cleared.board;this.score=addScore(this.score,[0,100,300,500,800][cleared.count]*this.level);this.lines+=cleared.count;this.level=1+Math.floor(this.lines/10);this.spawn();return true;}
  tick(ms){if(this.status!=='running'||!Number.isFinite(ms)||ms<0)return;this.elapsed+=ms;while(this.status==='running'&&this.elapsed>=this.interval()){this.elapsed-=this.interval();this.act(0,1,0);}}
}
Object.assign(API,{Game,clearRows,COLORS,SHAPES});

/* 3. Canvas and semantic HTML presentation */
const VERSION='0.1.0';
let ui=null;
function notice(message){if(ui)document.getElementById('message').textContent=message;}
function paintCells(ctx,board,piece,ghost=false,scale=30,ox=0,oy=0){
  for(const [x,y] of cells(piece.type,piece.rot,piece.x,piece.y)){
    const color=piece.penetrator?COLORS.P:COLORS[piece.type];ctx.fillStyle=color;ctx.strokeStyle=color;
    if(ghost){ctx.globalAlpha=0.38;ctx.lineWidth=2;ctx.strokeRect(ox+x*scale+3,oy+y*scale+3,scale-6,scale-6);ctx.globalAlpha=1;}
    else{ctx.fillRect(ox+x*scale+1,oy+y*scale+1,scale-2,scale-2);ctx.fillStyle='#ffffff20';ctx.fillRect(ox+x*scale+2,oy+y*scale+2,scale-4,2);}
  }
}
function render(){if(!ui)return;const g=ui.game,c=ui.canvas,ctx=c.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.fillStyle='#101811';ctx.fillRect(0,0,300,600);
  ctx.strokeStyle='#233021';ctx.lineWidth=.6;for(let x=0;x<=10;x++){ctx.beginPath();ctx.moveTo(x*30,0);ctx.lineTo(x*30,600);ctx.stroke();}for(let y=0;y<=20;y++){ctx.beginPath();ctx.moveTo(0,y*30);ctx.lineTo(300,y*30);ctx.stroke();}
  for(let y=0;y<20;y++)for(let x=0;x<10;x++)if(g.board[y][x]){ctx.fillStyle=COLORS[g.board[y][x]];ctx.fillRect(x*30+1,y*30+1,28,28);}
  if(g.p)paintCells(ctx,g.board,g.p);
  document.getElementById('score').textContent=String(g.score);document.getElementById('lines').textContent=String(g.lines);document.getElementById('level').textContent=String(g.level);document.getElementById('state').textContent={idle:'Ready to play',running:'In motion',paused:'Paused',over:'Game over'}[g.status];
  const veil=document.getElementById('veil');veil.hidden=g.status==='running';document.getElementById('veil-title').textContent={idle:'MAKE YOUR MOVE',paused:'TAKE A BREATH',over:'ONE MORE TRY',running:''}[g.status];document.getElementById('veil-note').textContent=g.status==='idle'?'Start a game. Find your rhythm.':g.status==='paused'?'Press Pause/Start or Escape to return.':'Restart for a fresh board.';
  drawPreview('next-piece',g.queue?.[0]);
  drawPreview('held-piece',g.held);
  /* RENDER_EXTENSIONS */
}
function mountUI(){
 document.getElementById('root').innerHTML=`<header><div class="brand"><div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><div class="eyebrow">A STUDY IN FALLING BLOCKS</div><h1>TETRIS ATELIER</h1></div></div><span class="version">v${VERSION}</span></header><div class="arena"><div class="rail left" id="left-rail"><section class="panel info" aria-label="Game info and controls"><h2>Game info<br>&amp; controls</h2><div class="stats"><div class="stat"><span class="label">Score</span><strong id="score">0</strong></div><div class="stat small"><span class="label">Level</span><strong id="level">1</strong></div><div class="stat small"><span class="label">Lines</span><strong id="lines">0</strong></div></div><div id="extras"></div><div class="state" id="state">Ready to play</div><div id="toggles" class="toggles"></div><div class="game-buttons"><button id="start" class="primary">Start/Restart</button><button id="pause">Pause/Start</button></div></section></div><div><div class="board-wrap"><canvas id="board" width="600" height="1200" tabindex="0" aria-label="Tetris board. Use keyboard controls."></canvas><div class="veil" id="veil"><strong id="veil-title"></strong><span id="veil-note"></span></div></div><p class="board-note">FIND YOUR RHYTHM.<br>LEAVE ROOM TO GROW.</p></div><div class="rail right" id="right-rail"><section class="panel help" id="help"><h2>At your fingertips</h2><div class="keys" id="keys"><div class="key-row"><span>Move</span><span><kbd>←</kbd> <kbd>→</kbd></span></div><div class="key-row"><span>Soft drop</span><kbd>↓</kbd></div><div class="key-row"><span>Rotate</span><span><kbd>↑</kbd> <kbd>X</kbd></span></div><div class="key-row"><span>Turn left</span><kbd>Z</kbd></div><div class="key-row"><span>Pause</span><kbd>Esc</kbd></div></div><p>Complete a row. Make a little space. Ten lines take you to the next level.</p></section></div></div><div class="message" id="message" role="status" aria-live="polite"></div>`;
 ui={game:new Game(),canvas:document.getElementById('board')};API.ui=ui;API.render=render;
 bindControls();
document.getElementById('extras').innerHTML='<div class="preview"><figure><figcaption>NEXT</figcaption><canvas id="next-piece" width="104" height="88" aria-label="Next piece"></canvas></figure></div>';
document.querySelector('.preview').insertAdjacentHTML('afterbegin','<figure><figcaption>HOLD</figcaption><canvas id="held-piece" width="104" height="88" aria-label="Held piece"></canvas></figure>');
 document.getElementById('keys').insertAdjacentHTML('beforeend','<div class="key-row"><span>Hold</span><kbd>C / Shift</kbd></div>');
 /* MOUNT_EXTENSIONS */
 render();
}

/* 4. Browser input and lifecycle adapters */
function installToggle(id,label){const panel=document.getElementById(id);if(!panel)return;const button=document.createElement('button');button.textContent=label;button.setAttribute('aria-controls',id);button.setAttribute('aria-expanded','true');button.addEventListener('click',()=>{panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));});document.getElementById('toggles').append(button);}
function bindControls(){
 const g=ui.game;const focus=()=>{ui.last=performance.now();ui.canvas.focus();render();};
 document.getElementById('start').addEventListener('click',()=>{g.start();focus();});
 document.getElementById('pause').addEventListener('click',()=>{if(g.status==='idle'||g.status==='over')g.start();else g.pause();focus();});
 ui.canvas.addEventListener('click',()=>ui.canvas.focus());installToggle('help','Controls / help');
 document.addEventListener('keydown',e=>{if(e.target.closest?.('input,select,textarea,button'))return;const handled=['ArrowLeft','ArrowRight','ArrowDown','ArrowUp','KeyX','KeyZ','Escape','Space','KeyC','ShiftLeft','ShiftRight','KeyP'];if(!handled.includes(e.code))return;e.preventDefault();
   if(e.repeat&&!['ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))return;
   if(e.code==='ArrowLeft')g.act(-1);else if(e.code==='ArrowRight')g.act(1);else if(e.code==='ArrowDown')g.soft();else if(e.code==='ArrowUp'||e.code==='KeyX')g.act(0,0,1);else if(e.code==='KeyZ')g.act(0,0,-1);else if(e.code==='Escape'){g.pause();ui.last=performance.now();}
   else if(['KeyC','ShiftLeft','ShiftRight'].includes(e.code))g.holdPiece();
   /* KEY_EXTENSIONS */
   render();
 });
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&g.status==='running'){g.pause();render();}ui.last=performance.now();});
 ui.last=performance.now();function frame(now){const dt=now-ui.last;ui.last=now;g.tick(dt);render();requestAnimationFrame(frame);}requestAnimationFrame(frame);
}

/* T010_SOURCE */
Game.prototype.draw=function(){if(!this.bag?.length){this.bag=[...TYPES];for(let i=6;i>0;i--){const j=Math.floor(this.rng()*(i+1));[this.bag[i],this.bag[j]]=[this.bag[j],this.bag[i]];}}return this.bag.pop();};
Game.prototype.next=function(){if(!this.queue?.length)this.queue=[this.draw()];const type=this.queue.shift();this.queue.push(this.draw());return type;};
const sourceStart=Game.prototype.start;Game.prototype.start=function(){this.bag=[];this.queue=[];sourceStart.call(this);};
function drawPreview(id,type){const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d');ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,52,44);if(type)paintCells(ctx,null,{type,rot:0,x:0,y:0},false,10,6,7);}

/* T011_HOLD */
const holdStart=Game.prototype.start;Game.prototype.start=function(){this.held=null;this.holdUsed=false;holdStart.call(this);};
const holdLock=Game.prototype.lock;Game.prototype.lock=function(){const result=holdLock.call(this);if(result)this.holdUsed=false;return result;};
Game.prototype.holdPiece=function(){if(this.status!=='running'||this.holdUsed)return false;const type=this.p.type,held=this.held;this.held=type;this.spawn(held||undefined);this.holdUsed=true;return true;};
/* APP_EXTENSIONS */
if (globalThis.__TETRIS_TEST__) globalThis.Tetris = API;
if(typeof document!=='undefined')mountUI();
/* UI_START */
</script></body></html>
